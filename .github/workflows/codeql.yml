name: CodeQL

on:
  workflow_dispatch:
  schedule:
    - cron: "43 1 * * 0"
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust

      - name: Build security-critical crates
        run: cargo build -p vac_core -p vac_runtime -p vac_trace -p vil_llm --locked

      - name: Analyze
        uses: github/codeql-action/analyze@v3
