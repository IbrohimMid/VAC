name: Release Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "29 1 * * 0"
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: release/vac
          - os: macos-latest
            binary: release/vac
          - os: windows-latest
            binary: release/vac.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-release-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-smoke-

      - name: Build vac release binary
        shell: bash
        run: cargo build -p vac_cli --bin vac --release

      - name: Run release smoke contract
        shell: bash
        run: bash scripts/release_smoke.sh "${{ matrix.binary }}"
