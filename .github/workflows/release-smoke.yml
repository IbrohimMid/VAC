  smoke-test-windows:
    name: Smoke Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Artifacts
        run: echo "Simulating artifact download for Windows..."
      - name: Run Smoke Test
        run: echo "Running Windows smoke test..."

  smoke-test-docker:
    name: Smoke Test (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Pull Docker Image
        run: echo "docker pull ghcr.io/repo/vac:${{ github.event.inputs.version || github.event.release.tag_name }}"
      - name: Verify Cosign Signature
        run: echo "cosign verify ghcr.io/repo/vac:${{ github.event.inputs.version || github.event.release.tag_name }}"
      - name: Run Docker Smoke Test
        run: echo "docker run --rm ghcr.io/repo/vac --version"

  smoke-test-homebrew:
    name: Smoke Test (Homebrew)
    runs-on: macos-latest
    steps:
      - name: Install via Homebrew
        run: echo "brew install namespace/tap/vac"
      - name: Run Smoke Test
        run: echo "vac --version"
