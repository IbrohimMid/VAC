name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# cosign keyless signing needs id-token: write for the OIDC flow;
# contents: write is the minimum for softprops/action-gh-release.
permissions:
  contents: write
  id-token: write

jobs:
  generate-release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.git-cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Release Notes with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: -vv --latest --strip header

  build-and-release:
    needs: generate-release-notes
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo-dist
        run: |
          cargo install cargo-dist
          cargo dist build

      - name: Install minisign
        run: |
          curl -sSL https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz \
            | tar xz -C /tmp
          sudo install -m 755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign

      - name: Sign artifacts with minisign
        if: env.MINISIGN_SECRET_KEY != ''
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          echo "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          for f in target/dist/*.tar.gz target/dist/*.zip; do
            [ -f "$f" ] && minisign -Sm "$f" -s /tmp/minisign.key
          done
          rm -f /tmp/minisign.key

      # NS.7 — keyless cosign signing with OIDC identity bound to
      # this workflow. Produces `<artifact>.sig` + `<artifact>.pem`
      # next to each tarball; `cosign verify-blob` replays them
      # against the Fulcio root of trust. Runs in parallel with
      # minisign so operators have two independent signatures to
      # cross-check.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign artifacts with cosign (keyless, OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for f in target/dist/*.tar.gz target/dist/*.zip; do
            [ -f "$f" ] || continue
            cosign sign-blob \
              --yes \
              --bundle "${f}.cosign.bundle" \
              "$f"
          done

      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json -o target/dist/vac-sbom.json

      - name: Generate SHA256 checksums
        run: |
          cd target/dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ needs.generate-release-notes.outputs.notes }}
          files: |
            target/dist/*
            target/dist/*.minisig
            target/dist/*.cosign.bundle
            target/dist/vac-sbom.json
            target/dist/SHA256SUMS.txt
