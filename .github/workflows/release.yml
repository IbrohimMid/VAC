name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  generate-release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.git-cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Release Notes with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: -vv --latest --strip header

  build-and-release:
    needs: generate-release-notes
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo-dist
        run: |
          cargo install cargo-dist
          cargo dist build

      - name: Install minisign
        run: |
          curl -sSL https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz \
            | tar xz -C /tmp
          sudo install -m 755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign

      - name: Sign artifacts with minisign
        if: env.MINISIGN_SECRET_KEY != ''
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          echo "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          for f in target/dist/*.tar.gz target/dist/*.zip; do
            [ -f "$f" ] && minisign -Sm "$f" -s /tmp/minisign.key
          done
          rm -f /tmp/minisign.key

      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json -o target/dist/vac-sbom.json

      - name: Generate SHA256 checksums
        run: |
          cd target/dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ needs.generate-release-notes.outputs.notes }}
          files: |
            target/dist/*
            target/dist/*.minisig
            target/dist/vac-sbom.json
            target/dist/SHA256SUMS.txt
