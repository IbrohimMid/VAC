[workspace]
members = [
    "crates/vil_ir",
    "crates/vil_knowledge",
    "crates/vil_rag",
    "crates/vil_inference",
    "crates/vil_trust",
    "crates/vil_validate",
    "crates/vil_context",
    "crates/vil_memory",
    "crates/vil_swarm",
    "crates/vil_llm",
    "crates/vil_metrics",
    "crates/vac_core",
    "crates/vac_tools",
    "crates/vac_trace",
    "crates/vac_cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Vastar Team <team@vastar.id>"]
license = "MIT"
repository = "https://github.com/vastar-id/vastar-agentic-cli"
homepage = "https://vastar.id/products/vac"
description = "VAC — Vastar Agentic CLI: Autonomous development CLI built on VIL Engine"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
toml = "0.8"

# CLI & TUI
clap = { version = "4.5", features = ["derive", "env", "unicode"] }
ratatui = "0.29"
crossterm = "0.28"

# Rust parsing & analysis
syn = { version = "2.0", features = ["full", "parsing", "printing", "visit", "visit-mut", "extra-traits"] }
proc-macro2 = "1.0"
quote = "1.0"

# HTTP & networking
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio-tungstenite = "0.24"

# Shared memory & mmap
memmap2 = "0.9"
shared_memory = "0.12"

# Embedded database
redb = "2.4"

# Embedding & ML
ort = { version = "2.0", features = ["cuda", "tensorrt"] }
fastembed = "4.4"

# Crypto & signing
coset = "0.3"
sha2 = "0.10"
rand = "0.8"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Misc
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.9"
dashmap = "6.1"
async-trait = "0.1"
dirs-next = "2.0"
regex = "1.11"
walkdir = "2.5"

# Workspace crate cross-references
vac_core = { path = "crates/vac_core" }
vac_tools = { path = "crates/vac_tools" }
vac_trace = { path = "crates/vac_trace" }
vil_ir = { path = "crates/vil_ir" }
vil_context = { path = "crates/vil_context" }
vil_memory = { path = "crates/vil_memory" }
vil_knowledge = { path = "crates/vil_knowledge" }
vil_swarm = { path = "crates/vil_swarm" }
vil_trust = { path = "crates/vil_trust" }
vil_llm = { path = "crates/vil_llm" }
vil_inference = { path = "crates/vil_inference" }
vil_rag = { path = "crates/vil_rag" }
vil_metrics = { path = "crates/vil_metrics" }
vil_validate = { path = "crates/vil_validate" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3
