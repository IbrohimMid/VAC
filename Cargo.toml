[workspace]
members = [
    "crates/vil_ir",
    "crates/vil_knowledge",
    "crates/vil_rag",
    "crates/vil_inference",
    "crates/vil_trust",
    "crates/vil_validate",
    "crates/vil_context",
    "crates/vil_memory",
    "crates/vil_swarm",
    "crates/vil_llm",
    "crates/vil_metrics",
    "crates/vac_core",
    "crates/vac_tools",
    "crates/vac_trace",
    "crates/vac_cli",
    "crates/vac_runtime", "crates/vac_approvals", "crates/vac_changeset", "crates/vac_shell", "crates/vac_session_control", "crates/vac_tui_runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Vastar Team <team@vastar.id>"]
license = "MIT"
repository = "https://github.com/IbrohimMid/VAC"
homepage = "https://vastar.id/products/vac"
description = "VAC — Vastar Agentic CLI: Autonomous development CLI built on VIL Engine"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
toml = "0.8"

# CLI & TUI
clap = { version = "4.5", features = ["derive", "env", "unicode"] }
ratatui = "0.29"
crossterm = "0.28"

# Rust parsing & analysis
syn = { version = "2.0", features = ["full", "parsing", "printing", "visit", "visit-mut", "extra-traits"] }
proc-macro2 = "1.0"
quote = "1.0"

# HTTP & networking
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Shared memory & mmap
memmap2 = "0.9"

# Embedded database
redb = "2.4"

# Scheduling
cron = "0.12"
notify = "6"

# Tokenization
tiktoken-rs = "0.6"
fastembed = "4.4"

# Crypto & signing
coset = "0.3"
sha2 = "0.10"
rand = "0.8"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
blake3 = "1.5"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = { version = "0.27", features = ["metrics"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "http-proto", "reqwest-client", "trace"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Misc
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.9"
dashmap = "6.1"
async-trait = "0.1"
dirs-next = "2.0"
regex = "1.11"
walkdir = "2.5"

# Workspace crate cross-references
vac_core = { path = "crates/vac_core" }
vac_tools = { path = "crates/vac_tools" }
vac_trace = { path = "crates/vac_trace" }
vil_ir = { path = "crates/vil_ir" }
vil_context = { path = "crates/vil_context" }
vil_memory = { path = "crates/vil_memory" }
vil_knowledge = { path = "crates/vil_knowledge" }
vil_swarm = { path = "crates/vil_swarm" }
vil_trust = { path = "crates/vil_trust" }
vil_llm = { path = "crates/vil_llm" }
vil_inference = { path = "crates/vil_inference" }
vil_rag = { path = "crates/vil_rag" }
vil_metrics = { path = "crates/vil_metrics" }
vil_validate = { path = "crates/vil_validate" }
vac_runtime = { path = "crates/vac_runtime" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = ["github"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
installers = ["shell", "homebrew"]
github-attestations = true
