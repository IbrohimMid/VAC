[workspace]
members = [
    # VIL semantic plane
    "crates/vil_ir",
    "crates/vil_knowledge",
    "crates/vil_rag",
    "crates/vil_inference",
    "crates/vil_trust",
    "crates/vil_validate",
    "crates/vil_context",
    "crates/vil_memory",
    "crates/vil_swarm",
    "crates/vil_llm",
    "crates/vil_metrics",
    "crates/vil_vwfd",
    "crates/vil_expr",

    # VAC core / runtime / engine
    "crates/vac_core",
    "crates/vac_tools",
    "crates/vac_trace",
    "crates/vac_cli",
    "crates/vac_runtime",
    "crates/vac_approvals",
    "crates/vac_changeset",
    "crates/vac_shell",
    "crates/vac_session_control",
    "crates/vac_tui_runtime",
    "crates/vac_ingest",
    "crates/vac_trajectory",
    "crates/vac_signal",
    "crates/vac_tool_core",
    "crates/vac_session_engine",
    "crates/vac_session_primitives",
    "crates/vac_memory",
    "crates/vac_mcp_core",
    "crates/vac_bridge",
    "crates/vac_skill",

    # Shell contracts (DTO layer — no engine dep)
    "crates/vac_shell_contracts",

    # Shell widget crates (ratatui + contracts only)
    "crates/vac_shell_palette",
    "crates/vac_shell_bridge",
    "crates/vac_shell_popup",
    "crates/vac_shell_approval_bar",
    "crates/vac_shell_approval_detail",
    "crates/vac_shell_shortcuts",
    "crates/vac_shell_model_switcher",
    "crates/vac_shell_session_browser",
    "crates/vac_shell_overlay",
    "crates/vac_shell_plan",
    "crates/vac_shell_plan_view",
    "crates/vac_shell_diff_view",
    "crates/vac_shell_activity",
    "crates/vac_shell_status_bar",

    # Shell host state (no engine dep)
    "crates/vac_shell_host_surface",
    "crates/vac_shell_host_approval",
    "crates/vac_shell_host_paths",
    "crates/vac_shell_host_model",
    "crates/vac_shell_host_sessions",
    "crates/vac_shell_host_activity",
    "crates/vac_shell_host_diff",
    "crates/vac_shell_host_plan",
    "crates/vac_shell_host_status",
    "crates/vac_shell_host_commands",
    "crates/vac_shell_host_vac_config",
    "crates/vac_shell_composition",

    # Shell app orchestrator
    "crates/vac_shell_app",

    # Shell host exceptions (ADR-sanctioned engine access — D7A/B/C/D8/D9/D10)
    "crates/vac_shell_host_vac_engine_probe",
    "crates/vac_shell_host_vac_command_adapter",
    "crates/vac_shell_host_vac_tool_dispatcher",
    "crates/vac_shell_host_transcript_projection",
    "crates/vac_shell_host_event_projection",

    # Runtime loop + entrypoint
    "crates/vac_shell_keymap",
    "crates/vac_shell_runtime_loop",
    "crates/vac_shell_entrypoint",

    # Shell host diagnostics
    "crates/vac_shell_host_doctor",
    "crates/vac_shell_host_doctor_command",

    # Dev-only test support (never a production dep)
    "crates/vac_shell_test_support",
]
exclude = [
    # Wave 4 — Stakpak donor checkout. Treated as read-only reference;
    # never compiled as part of the VAC workspace. Components are lifted
    # into VAC-owned crates via the donor extraction map, not linked.
    "vendor/stakpak",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Vastar Team <team@vastar.id>"]
license = "MIT"
repository = "https://github.com/IbrohimMid/VAC"
homepage = "https://vastar.id/products/vac"
description = "VAC — Vastar Agentic CLI: Autonomous development CLI built on VIL Engine"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# Serialization
similar = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_cbor = "0.11"
toml = "0.8"
semver = { version = "1.0", features = ["serde"] }

# CLI & TUI
clap = { version = "4.5", features = ["derive", "env", "unicode"] }
ratatui = "0.29"
crossterm = "0.28"

# Rust parsing & analysis
syn = { version = "2.0", features = ["full", "parsing", "printing", "visit", "visit-mut", "extra-traits"] }
proc-macro2 = "1.0"
quote = "1.0"

# HTTP & networking
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Shared memory & mmap
memmap2 = "0.9"

# Embedded database
redb = "2.4"

# Scheduling
cron = "0.12"
notify = { version = "6" }

# Tokenization
tiktoken-rs = "0.6"
fastembed = "4.4"

# Local inference (B1) — pure Rust ML framework. Opt-in per-crate via feature gate.
# Candle is the primary backend per reviewer hard rule #2 (no FFI/C++ toolchain risk).
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
tokenizers = "0.20"

# Benchmarking (M3). `harness = false` on individual benches lets criterion
# supply its own main() so we get stable, statistically-meaningful timings
# instead of libtest's noisy microbench.
criterion = { version = "0.5", features = ["html_reports"] }

# Crypto & signing
coset = "0.3"
sha2 = "0.10"
rand = "0.8"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
blake3 = "1.5"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = { version = "0.27", features = ["metrics"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "http-proto", "reqwest-client", "trace"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Misc
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.9"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "tracing"] }
dashmap = "6.1"
async-trait = "0.1"
dirs-next = "2.0"
regex = "1.11"
walkdir = "2.5"

# Workspace crate cross-references
vac_core = { path = "crates/vac_core" }
vac_tools = { path = "crates/vac_tools" }
vac_trace = { path = "crates/vac_trace" }
vac_trajectory = { path = "crates/vac_trajectory" }
vil_ir = { path = "crates/vil_ir" }
vil_context = { path = "crates/vil_context" }
vil_memory = { path = "crates/vil_memory" }
vil_knowledge = { path = "crates/vil_knowledge" }
vil_swarm = { path = "crates/vil_swarm" }
vil_trust = { path = "crates/vil_trust" }
vil_llm = { path = "crates/vil_llm" }
vil_inference = { path = "crates/vil_inference" }
vil_rag = { path = "crates/vil_rag" }
vil_metrics = { path = "crates/vil_metrics" }
vil_validate = { path = "crates/vil_validate" }
vil_vwfd = { path = "crates/vil_vwfd" }
vil_expr = { path = "crates/vil_expr" }
vac_ingest = { path = "crates/vac_ingest" }
vac_runtime = { path = "crates/vac_runtime" }
vac_signal = { path = "crates/vac_signal" }
vac_tool_core = { path = "crates/vac_tool_core" }
vac_session_engine = { path = "crates/vac_session_engine" }
vac_session_primitives = { path = "crates/vac_session_primitives" }
vac_memory = { path = "crates/vac_memory" }
vac_mcp_core = { path = "crates/vac_mcp_core" }
vac_bridge = { path = "crates/vac_bridge" }
vac_skill = { path = "crates/vac_skill" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = ["github"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
installers = ["shell", "homebrew"]
github-attestations = true
