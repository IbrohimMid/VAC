[package]
name = "vac_shell_host_transcript_projection"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "D9 — host-side projection from D7E/D8 transcript tool-use rows into operator-safe ActivityLog entries + summaries. Fourth ADR-sanctioned host-side exception (depends on vac_session_engine + vac_shell_contracts). Read-only — never mutates the transcript. Not reachable from any UI / widget / bridge / app / runtime-loop / entrypoint normal-dep graph."

[dependencies]
vac_session_engine = { path = "../vac_session_engine" }
vac_shell_contracts = { path = "../vac_shell_contracts" }
vac_tool_core = { path = "../vac_tool_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
