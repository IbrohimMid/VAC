[package]
name = "vac_shell_entrypoint"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "D1 — opt-in entrypoint for the new ShellApp cockpit. Boots ShellComposition + ShellApp from a project root behind a single function. No interactive event loop yet (D2 concern); no engine coupling (D3+ concern)."

[dependencies]
vac_shell_contracts = { path = "../vac_shell_contracts" }
vac_shell_app = { path = "../vac_shell_app" }
vac_shell_composition = { path = "../vac_shell_composition" }
vac_shell_host_paths = { path = "../vac_shell_host_paths" }
vac_shell_host_model = { path = "../vac_shell_host_model" }
vac_shell_host_activity = { path = "../vac_shell_host_activity" }
vac_shell_host_sessions = { path = "../vac_shell_host_sessions" }
vac_shell_bridge = { path = "../vac_shell_bridge" }
vac_shell_host_vac_config = { path = "../vac_shell_host_vac_config" }

[dev-dependencies]
tempfile = "3"
# D6 — only the dogfood example links the runtime loop. Dev-dep
# so the entrypoint's runtime crate graph stays free of
# crossterm/ratatui.
vac_shell_runtime_loop = { path = "../vac_shell_runtime_loop" }
