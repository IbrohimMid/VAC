[package]
name = "vac_shell_host_model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-side model projection plus an in-memory model-selection seam (ModelSelectionState + ModelSelectionController) plus path-backed snapshot persistence (JsonFilePersistor + vac_paths_persistor + boot_selection_state). No provider API, no secret manager, no API-key handling, no semantic model runtime switching."

[dependencies]
vac_shell_contracts = { path = "../vac_shell_contracts" }
vac_shell_model_switcher = { path = "../vac_shell_model_switcher" }
# Slice 9: host crate now implements `ModelController` and emits
# `ShellAction` from widget events. Acceptable for a host crate —
# UI crates still must not link to the bridge.
vac_shell_bridge = { path = "../vac_shell_bridge" }
# Slice 9.1: JsonFilePersistor needs JSON (de)serialisation. The
# bridge stays serde-free; serde itself already lives in the
# contract DTOs.
serde_json = "1"

# `ratatui` only appears in the integration test
# (`tests/source_to_view.rs`) for the `TestBackend` render proof.
# Runtime crate has no need of it — kept as a dev-dep so the
# production dep graph stays `vac_shell_contracts` +
# `vac_shell_model_switcher` only.
[dev-dependencies]
ratatui.workspace = true
tempfile = "3"
# Slice 9.2 integration tests construct a real `VacPathsImpl` to
# prove the persistor factory + boot helper resolve the path
# through the trait. Dev-only — runtime crate stays independent of
# the concrete VacPaths impl.
vac_shell_host_paths = { path = "../vac_shell_host_paths" }
