[package]
name = "vac_shell_runtime_loop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "D2.2 — minimal interactive event-loop harness for the new ShellApp cockpit. Owns crossterm + ratatui I/O so widget crates stay pure. No engine coupling."

[dependencies]
vac_shell_app = { path = "../vac_shell_app" }
vac_shell_keymap = { path = "../vac_shell_keymap" }
vac_shell_contracts = { path = "../vac_shell_contracts" }
crossterm = "0.28"
ratatui.workspace = true
thiserror = "1"

[dev-dependencies]
vac_shell_composition = { path = "../vac_shell_composition" }
vac_shell_bridge = { path = "../vac_shell_bridge" }
vac_shell_host_paths = { path = "../vac_shell_host_paths" }
vac_shell_host_model = { path = "../vac_shell_host_model" }
vac_shell_host_approval = { path = "../vac_shell_host_approval" }
vac_shell_host_activity = { path = "../vac_shell_host_activity" }
vac_shell_host_surface = { path = "../vac_shell_host_surface" }
tempfile = "3"
