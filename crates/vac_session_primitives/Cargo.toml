[package]
name = "vac_session_primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "VAC session primitives — leaf-level storage/transport types (cron, hooks, web, monitor, error) shared by vac_session_engine and vac_tools. No session-runtime deps."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "fs", "io-util", "time", "rt", "macros", "process"] }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
cron = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
vac_tool_core = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
