[package]
name = "vac_tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "VAC Tools — tool registry, execution, MCP bridge, and sandbox"

[dependencies]
vil_knowledge = { workspace = true }
vil_ir = { workspace = true }
vil_validate = { workspace = true }
vil_trust = { workspace = true }
vil_rag = { workspace = true }
vil_context = { workspace = true }
vac_signal = { workspace = true, features = ["rewind"] }
vac_tool_core = { workspace = true }
vac_mcp_core = { workspace = true }
sha2 = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
libc = "0.2"
reqwest = { workspace = true }
walkdir = { workspace = true }
futures = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
glob = "0.3"
toml = { workspace = true }
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
base64 = "0.22"
regex = { workspace = true }
tokio-tungstenite = { version = "0.29.0", features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3.32"
portable-pty = "0.9.0"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.14"

[lints]
workspace = true
