[package]
name = "vac_session_engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "VAC Session Engine — submit-message lifecycle, transcript durability, slash processing, compact boundary, usage tracking. Consumed by both CLI (headless) and TUI (interactive) drivers."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "fs", "io-util", "time", "rt", "macros"] }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

vac_tool_core = { workspace = true }
vac_core = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = "3.14"
tokio = { workspace = true, features = ["full", "test-util"] }
criterion = { workspace = true }

[[bench]]
name = "submit_one"
harness = false

[lints]
workspace = true
