[package]
name = "vil_rag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "VIL RAG — semantic indexing, embedding, and similarity search"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
fastembed = { workspace = true }
redb = { workspace = true }
tokio = { workspace = true }

# HNSW (B2 Paket C scaffold). Pure-Rust, no FFI, serde-compatible.
# Gated behind `hnsw` feature so default builds stay identical to the
# HashMap-backed implementation while the migration is scaffolded.
instant-distance = { version = "0.6", optional = true }

[features]
default = []
# Enables the HNSW ANN backend in `ann.rs`. Opt-in today; will become the
# default path once Paket C lands the redb-backed store and persistence glue.
hnsw = ["dep:instant-distance"]

[dev-dependencies]
tempfile = "3.14"
criterion = { workspace = true }

[[bench]]
name = "search"
harness = false

[lints]
workspace = true
