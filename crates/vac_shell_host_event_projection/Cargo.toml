[package]
name = "vac_shell_host_event_projection"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "D4 — neutral RuntimeEventView DTO + projection into ShellActivityEntry. Hosts adapt their concrete VAC engine event types to RuntimeEventView; the shell's ActivityLog consumes the projected entries."

[dependencies]
vac_shell_contracts = { path = "../vac_shell_contracts" }
vac_shell_host_activity = { path = "../vac_shell_host_activity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# D10 — ADR exception 5: host-side live feed bridge reads SubmitChunk stream
vac_session_engine = { path = "../vac_session_engine" }
vac_tool_core = { path = "../vac_tool_core" }
futures = "0.3"
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "macros"] }
vac_shell_contracts = { path = "../vac_shell_contracts" }
