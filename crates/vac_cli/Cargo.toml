[package]
name = "vac_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "VAC CLI — Terminal interface, TUI, REPL, and command handlers"

[[bin]]
name = "vac"
path = "src/main.rs"

[features]
default = []
# TUI2: Transplanted TUI from Stakpak (Apache 2.0)
# Enable with --features tui2
tui2 = []

[dependencies]
vac_core = { workspace = true }
vil_swarm = { workspace = true }
vac_trace = { workspace = true }
vac_tools = { workspace = true }
vac_runtime = { workspace = true }
vil_ir = { workspace = true }
vil_validate = { workspace = true }

clap = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }
regex = "1.11"
similar = "2.6.0"

# TUI2 dependencies (from Stakpak)
textwrap = "0.16.2"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"
rand = "0.9"
ansi-to-tui = "7.0.0"
syntect = "5.2.0"
nucleo-matcher = "0.3.1"
ignore = "0.4.23"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
shlex = "1.3.0"
url = "2"
base64 = "0.22"
vt100 = "0.15.2"
dirs = "5.0"
serde_yaml = "0.9"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(unix, windows))'.dependencies]
portable-pty = "0.8"

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3"
