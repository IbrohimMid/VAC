vac_shell_model_switcher = { path = "../vac_shell_model_switcher" }
vac_shell_session_browser = { path = "../vac_shell_session_browser" }
vac_shell_diff_view = { path = "../vac_shell_diff_view" }
vac_shell_approval_bar = { path = "../vac_shell_approval_bar" }
vac_shell_approval_detail = { path = "../vac_shell_approval_detail" }
crossterm = "0.28"
