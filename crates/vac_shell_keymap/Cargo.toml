[package]
name = "vac_shell_keymap"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "D2 — pure crossterm KeyEvent → RoutedKey mapping for the new ShellApp cockpit. No I/O, no state, no engine coupling. Hosts feed crossterm events in and route the result through ShellApp dispatchers (D2.1)."

