# Build cache & speed config for VAC workspace.
# Scope: applies only when cargo is run inside this repo (or its worktrees).

[build]
# Keep the repo portable by default. CI and local workflows can still
# override this via `CARGO_TARGET_DIR` when they want a custom cache path.
target-dir = "target"

# Leave ~2 cores for editor/agent responsiveness on 12-thread machines.
jobs = 10

# sccache is installed on dev boxes; activate when present. Harmless
# if the binary is missing — cargo emits a warning and continues.
# Comment out if a CI runner hasn't got it.
rustc-wrapper = "sccache"

# mold is the single biggest wallclock win on this dep graph: default
# `ld` takes 10–30 s per test-binary link; mold drops that to 1–3 s.
# Requires `sudo apt install mold clang` (both already present on the
# dev box when this config was landed).
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[profile.dev]
# "line-tables-only" keeps backtraces usable but cuts debug-info size ~70%
# and shaves measurable time off link step. Switch to 0 if you never debug.
debug = "line-tables-only"
incremental = true
# More codegen units = more parallelism, slightly worse runtime (fine for dev).
codegen-units = 256

[profile.dev.package."*"]
# Dependencies rarely need debug info. Stripping it here is the single biggest
# win for this workspace given the LLM/RAG dep graph.
debug = false
